<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="50" cy="50" r="48" fill="url(#bg-gradient)" />
  
  <!-- 待办事项图标 -->
  <g transform="translate(50, 50)">
    <!-- 清单背景 -->
    <rect x="-20" y="-25" width="40" height="50" rx="4" fill="white" opacity="0.95" />
    
    <!-- 勾选标记 -->
    <polyline 
      points="-8,2 0,10 12,-5" 
      fill="none" 
      stroke="#10B981" 
      stroke-width="4" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    
    <!-- 线条装饰 -->
    <line x1="-12" y1="-15" x2="12" y2="-15" stroke="#E5E7EB" stroke-width="2" stroke-linecap="round" />
    <line x1="-12" y1="-5" x2="8" y2="-5" stroke="#E5E7EB" stroke-width="2" stroke-linecap="round" />
    <line x1="-12" y1="5" x2="10" y2="5" stroke="#E5E7EB" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
